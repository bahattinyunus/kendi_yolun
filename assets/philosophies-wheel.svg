<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%">
  <defs>
    <linearGradient id="wheelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <filter id="centerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="900" height="460" fill="url(#wheelBg)" rx="16" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Başlık -->
  <text x="450" y="38" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#f9fafb" letter-spacing="1.5">
    7 KESİŞEN FELSEFİ GELENEK &amp; ORTAK MERKEZ
  </text>
  <text x="450" y="58" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle" fill="#9ca3af">
    Farklı Çağlar ve Coğrafyalardan Tek Bir Varoluşsal Uyanışa Açılan Pencereler
  </text>

  <!-- Dış Yörünge Halkası -->
  <circle cx="450" cy="255" r="150" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Merkez: Kendi Hakikatin / OM -->
  <circle cx="450" cy="255" r="48" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" filter="url(#centerGlow)"/>
  <text x="450" y="250" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#c7d2fe">KENDİ</text>
  <text x="450" y="270" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#a5b4fc">YOLUN</text>

  <!-- 1. Budizm (Üst) -->
  <g transform="translate(450, 105)">
    <line x1="0" y1="20" x2="0" y2="102" stroke="#60a5fa" stroke-width="1.5" opacity="0.6"/>
    <circle r="30" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
    <text y="-5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#93c5fd">BUDİZM</text>
    <text y="10" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#60a5fa">Anatta / Zihin</text>
  </g>

  <!-- 2. Taoizm (Üst Sağ) -->
  <g transform="translate(585, 145)">
    <line x1="-15" y1="15" x2="-96" y2="78" stroke="#34d399" stroke-width="1.5" opacity="0.6"/>
    <circle r="30" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text y="-5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#6ee7b7">TAOİZM</text>
    <text y="10" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#34d399">Wu-Wei / Akış</text>
  </g>

  <!-- 3. Stoacılık (Sağ Alt) -->
  <g transform="translate(600, 310)">
    <line x1="-20" y1="-10" x2="-106" y2="-38" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
    <circle r="30" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text y="-5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fde68a">STOACILIK</text>
    <text y="10" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#fbbf24">Amor Fati</text>
  </g>

  <!-- 4. Varoluşçuluk (Alt) -->
  <g transform="translate(450, 405)">
    <line x1="0" y1="-20" x2="0" y2="-102" stroke="#f43f5e" stroke-width="1.5" opacity="0.6"/>
    <circle r="30" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <text y="-5" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#fda4af">VAROLUŞÇULUK</text>
    <text y="10" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#f43f5e">Nietzsche / Seçim</text>
  </g>

  <!-- 5. Jung Psikolojisi (Sol Alt) -->
  <g transform="translate(300, 310)">
    <line x1="20" y1="-10" x2="106" y2="-38" stroke="#c084fc" stroke-width="1.5" opacity="0.6"/>
    <circle r="30" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <text y="-5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#e9d5ff">C.G. JUNG</text>
    <text y="10" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#c084fc">Gölge / Self</text>
  </g>

  <!-- 6. Absürdizm (Üst Sol) -->
  <g transform="translate(315, 145)">
    <line x1="15" y1="15" x2="96" y2="78" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>
    <circle r="30" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <text y="-5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fdba74">ABSÜRDİZM</text>
    <text y="10" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#f97316">Camus / İsyan</text>
  </g>

  <!-- 7. Tasavvuf (Sol Eksen / Tamamlayıcı) -->
  <g transform="translate(160, 255)">
    <line x1="30" y1="0" x2="242" y2="0" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>
    <circle r="30" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <text y="-5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#fbcfe8">TASAVVUF</text>
    <text y="10" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#ec4899">Mevlana / Vahdet</text>
  </g>

  <!-- Sağ Eksen: Zen Tamamlayıcı -->
  <g transform="translate(740, 255)">
    <line x1="-30" y1="0" x2="-242" y2="0" stroke="#10b981" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>
    <circle r="30" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text y="-5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#a7f3d0">ZEN</text>
    <text y="10" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle" fill="#10b981">Şimdi ve Burada</text>
  </g>
</svg>

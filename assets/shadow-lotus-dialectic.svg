<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <defs>
    <linearGradient id="dialBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="lotusBloom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="mudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b1d11" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1c0d06"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="950" height="420" fill="url(#dialBg)" rx="16" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Başlık -->
  <text x="475" y="38" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#f9fafb" letter-spacing="1.5">
    LOTUS VE ÇAMUR DİYALEKTİĞİ (GÖLGE ENTEGRASYONU)
  </text>
  <text x="475" y="60" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle" fill="#9ca3af">
    "Aydınlanma ışığı hayal ederek değil, karanlığı bilince katarak gerçekleşir." — C.G. Jung
  </text>

  <!-- Su Seviyesi Çizgisi -->
  <line x1="50" y1="210" x2="900" y2="210" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,6" opacity="0.6"/>
  <text x="70" y="200" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Su Yüzeyi / Bilinç Eşiği (Threshold)</text>

  <!-- ÜST ALAN: AYDINLIK & BİLİNÇ -->
  <!-- Güneş Halesi -->
  <circle cx="475" cy="140" r="75" fill="#fef08a" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Lotus Çiçeği (Merkez) -->
  <g transform="translate(475, 175) scale(1.1)" filter="url(#softGlow)">
    <path d="M 0 10 C -30 -25, -65 -10, -55 25 C -40 38, -15 35, 0 38 Z" fill="url(#lotusBloom)" opacity="0.75"/>
    <path d="M 0 10 C 30 -25, 65 -10, 55 25 C 40 38, 15 35, 0 38 Z" fill="url(#lotusBloom)" opacity="0.75"/>
    <path d="M 0 10 C -20 -35, -40 -30, -30 20 C -20 30, -5 32, 0 38 Z" fill="url(#lotusBloom)" opacity="0.9"/>
    <path d="M 0 10 C 20 -35, 40 -30, 30 20 C 20 30, 5 32, 0 38 Z" fill="url(#lotusBloom)" opacity="0.9"/>
    <path d="M 0 -40 C -18 -10, -12 20, 0 38 C 12 20, 18 -10, 0 -40 Z" fill="#fbbf24"/>
  </g>

  <!-- Üst Sol Açıklama: Persona & Aydınlanma -->
  <g transform="translate(180, 120)">
    <rect x="-110" y="-30" width="220" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.8"/>
    <text y="-8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#38bdf8">LOTUS ÇİÇEĞİ</text>
    <text y="12" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#cbd5e1">Bilinç, Bilgelik, Saflık</text>
    <text y="26" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#94a3b8">Bireyleşmiş Öz (Self)</text>
  </g>

  <!-- Üst Sağ Açıklama: Nirvana & Birlik -->
  <g transform="translate(770, 120)">
    <rect x="-110" y="-30" width="220" height="65" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2" opacity="0.8"/>
    <text y="-8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fbbf24">IŞIK VE ŞEFKAT</text>
    <text y="12" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#cbd5e1">Kabul, Hoşgörü, Sevgi</text>
    <text y="26" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#94a3b8">Yargıların Ötesindeki Huzur</text>
  </g>

  <!-- ALT ALAN: ÇAMUR, KÖKLER & GÖLGE -->
  <rect x="50" y="210" width="850" height="185" fill="url(#mudGrad)" rx="8" opacity="0.6"/>

  <!-- Kökler (Gölgeye Uzanış) -->
  <g stroke="#d97706" stroke-width="2" opacity="0.75" fill="none">
    <path d="M 475 210 Q 460 260, 430 330 Q 410 370, 390 380"/>
    <path d="M 475 210 Q 480 250, 510 320 Q 530 360, 560 385"/>
    <path d="M 475 210 Q 465 290, 475 385"/>
    <path d="M 460 270 Q 420 290, 360 320"/>
    <path d="M 490 270 Q 540 300, 600 330"/>
  </g>

  <!-- Alt Sol Açıklama: Çamur & Günah -->
  <g transform="translate(180, 295)">
    <rect x="-110" y="-30" width="220" height="68" rx="8" fill="#18181b" stroke="#f43f5e" stroke-width="1.2" opacity="0.8"/>
    <text y="-8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#f43f5e">ÇAMUR VE BALÇIK</text>
    <text y="12" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#fca5a5">Samsara, Şehvet, Para, Kibir</text>
    <text y="26" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#f87171">Hata, Çöküş &amp; Istırap</text>
  </g>

  <!-- Alt Sağ Açıklama: Jungiyen Gölge -->
  <g transform="translate(770, 295)">
    <rect x="-110" y="-30" width="220" height="68" rx="8" fill="#18181b" stroke="#a855f7" stroke-width="1.2" opacity="0.8"/>
    <text y="-8" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#c084fc">GÖLGE ARKETİPİ</text>
    <text y="12" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle" fill="#e9d5ff">Bilinçdışı Güç Kaynağı</text>
    <text y="26" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle" fill="#d8b4fe">Reddedilen İnsani Doğamız</text>
  </g>

  <!-- Merkez Alt Mesaj -->
  <text x="475" y="375" font-family="'Georgia', serif" font-style="italic" font-size="12" text-anchor="middle" fill="#fef08a" opacity="0.9">
    "Çamur çiçeğin düşmanı değil, çiçeğin varoluşsal yakıtıdır."
  </text>
</svg>
